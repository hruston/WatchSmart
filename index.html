<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchSmart - Współdzielenie Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Zmiana czcionki na bardzo nowoczesny i czytelny krój 'Inter' -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #09090b;
            --surface-color: #18181b;
            --surface-hover: #27272a;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-primary: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --offer-color: #34d399;
            --offer-bg: rgba(16, 185, 129, 0.1);
            --seek-color: #818cf8;
            --seek-bg: rgba(99, 102, 241, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, rgba(99, 102, 241, 0.08), transparent 40%);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70px;
            box-sizing: border-box;
        }

        .logo {
            height: 45px;
            width: auto;
        }

        .container {
            max-width: 800px;
            margin: 40px auto 60px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .forum-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ========== FORMULARZ ========== */
        .post-form {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .post-form input,
        .post-form select,
        .post-form textarea,
        .comment-form input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .post-form select option {
            background: var(--surface-color);
            color: var(--text-main);
        }

        .post-form input:focus,
        .post-form select:focus,
        .post-form textarea:focus,
        .comment-form input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .submit-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            align-self: flex-end;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }

        /* ========== FILTRY ========== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--surface-color);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            color: var(--text-main);
            border-color: #52525b;
        }

        .filter-btn.active {
            background: var(--text-main);
            color: var(--bg-color);
            border-color: var(--text-main);
            font-weight: 600;
        }

        .search-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 16px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            min-width: 220px;
            transition: all 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent-primary);
        }

        /* ========== KARTY OGŁOSZEŃ ========== */
        #postsList {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-sizing: border-box;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .post-card:hover {
            border-color: #3f3f46;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .post-badges {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .post-author {
            font-weight: 600;
            color: var(--text-main);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-author i {
            color: var(--text-muted);
            font-size: 18px;
        }

        .badge-type {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-offer {
            background: var(--offer-bg);
            color: var(--offer-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-seek {
            background: var(--seek-bg);
            color: var(--seek-color);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .post-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .post-text {
            font-size: 15px;
            line-height: 1.6;
            color: #d4d4d8;
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 14px;
        }

        .post-contact {
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-color);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }

        .post-contact i {
            color: var(--text-main);
        }

        .post-contact a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s;
        }

        .post-contact a:hover {
            color: var(--accent-primary);
        }

        .toggle-comments-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle-comments-btn:hover {
            background: var(--surface-hover);
            border-color: #52525b;
        }

        /* ========== KOMENTARZE ========== */
        .comments-container {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            box-sizing: border-box;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .comments-container.open {
            display: block;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .comment-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            color: #d4d4d8;
        }

        .comment-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .comment-meta strong {
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .comment-meta span {
            color: var(--text-muted);
        }

        .comment-form {
            display: grid;
            grid-template-columns: 1fr 2fr auto;
            gap: 12px;
            width: 100%;
        }

        .comment-btn {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .comment-btn:hover {
            background: #d4d4d8;
            transform: translateY(-1px);
        }

        footer {
            text-align: center;
            padding: 40px 0;
            font-size: 14px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .container { margin-top: 20px; }
            .form-grid-2, .comment-form { grid-template-columns: 1fr; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .submit-btn, .comment-btn { width: 100%; }
            .post-footer { flex-direction: column; align-items: flex-start; }
            .toggle-comments-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<header>
    <img src="https://raw.githubusercontent.com/hruston/WatchSmart/refs/heads/main/Ikony%20Watchsmart/logo1.png" alt="WatchSmart" class="logo">
</header>

<main class="container">

    <section class="forum-section" id="forumSection">
        <div class="forum-title">TABLICA OGŁOSZEŃ</div>

        <div class="post-form">
            <select id="postType">
                <option value="SZUKAM">🔍 Szukam miejsca na platformie</option>
                <option value="OFERUJĘ">🟢 Oferuję miejsce na platformie</option>
            </select>
            <div class="form-grid-2">
                <input type="text" id="nickname" placeholder="Twój nick (np. Marek)" maxlength="35">
                <input type="text" id="contact" placeholder="Twój e-mail / kontakt" maxlength="120">
            </div>
            <textarea id="postInput" rows="3" placeholder="Wpisz szczegóły ogłoszenia..." maxlength="500"></textarea>
            <button type="button" class="submit-btn" onclick="addPost()">
                Opublikuj ogłoszenie
            </button>
        </div>

        <div class="filter-bar">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setTypeFilter('ALL', this)">Wszystkie</button>
                <button class="filter-btn" onclick="setTypeFilter('OFERUJĘ', this)">Oferują miejsce</button>
                <button class="filter-btn" onclick="setTypeFilter('SZUKAM', this)">Szukają miejsca</button>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="Szukaj ogłoszeń..." oninput="renderPosts()">
        </div>

        <div id="postsList"></div>
    </section>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
        getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
        arrayUnion, query, orderBy, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyALbBW9S9BdFaZvvHiW_TXvar6ZtnUhvvI",
        authDomain: "watchsmart-50fb9.firebaseapp.com",
        projectId: "watchsmart-50fb9",
        storageBucket: "watchsmart-50fb9.firebasestorage.app",
        messagingSenderId: "498356410021",
        appId: "1:498356410021:web:b681e4212e0bd2d0171f4c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allPosts = [];
    let currentTypeFilter = "ALL";
    const openCommentSections = new Set();

    function getSafeDate(field) {
        if (!field) return null;
        if (typeof field.toDate === 'function') return field.toDate();
        return new Date(field);
    }

    window.setTypeFilter = function (type, btnElement) {
        currentTypeFilter = type;
        document.querySelectorAll('.filter-buttons .filter-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        btnElement.classList.add('active');
        renderPosts();
    };

    async function cleanupExpiredPosts(postsSnapshot) {
        try {
            const now = new Date();
            const deletePromises = [];
            postsSnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                let isExpired = false;
                const expireDate = getSafeDate(data.expiresAt);
                const createDate = getSafeDate(data.createdAt);
                if (expireDate) {
                    if (now > expireDate) isExpired = true;
                } else if (createDate) {
                    const diffDays = (now - createDate) / (1000 * 60 * 60 * 24);
                    if (diffDays > 30) isExpired = true;
                }
                if (isExpired) {
                    deletePromises.push(deleteDoc(doc(db, "posts", docSnap.id)));
                }
            });
            if (deletePromises.length > 0) {
                await Promise.all(deletePromises);
                console.log(`Usunięto ${deletePromises.length} przeterminowanych/starych postów.`);
            }
        } catch (error) {
            console.error("Błąd podczas czyszczenia starych postów:", error);
        }
    }

    window.addPost = async function () {
        const postType = document.getElementById("postType").value;
        const nickname = document.getElementById("nickname").value.trim();
        const contact = document.getElementById("contact").value.trim();
        const rawText = document.getElementById("postInput").value.trim();

        if (rawText.length < 3) {
            alert("Opisz krótko swoje ogłoszenie (min. 3 znaki).");
            return;
        }

        const prefix = `[${postType}] `;
        const finalText = (prefix + rawText).slice(0, 500);

        const expirationDate = new Date();
        expirationDate.setDate(expirationDate.getDate() + 30);

        try {
            await addDoc(collection(db, "posts"), {
                nickname: nickname || "Anonim",
                contact: contact || "Brak kontaktu",
                text: finalText,
                comments: [],
                createdAt: serverTimestamp(),
                expiresAt: expirationDate
            });

            document.getElementById("postInput").value = "";
            document.getElementById("contact").value = "";
            document.getElementById("nickname").value = "";
        } catch (error) {
            console.error("Błąd dodawania ogłoszenia:", error);
            alert("Nie udało się dodać ogłoszenia.");
        }
    };

    window.toggleComments = function (postId) {
        const el = document.getElementById(`comments-${postId}`);
        if (!el) return;
        el.classList.toggle("open");
        if (el.classList.contains("open")) {
            openCommentSections.add(postId);
        } else {
            openCommentSections.delete(postId);
        }
    };

    window.addComment = async function (postId) {
        const nickEl = document.getElementById(`comment-nick-${postId}`);
        const textEl = document.getElementById(`comment-text-${postId}`);

        const nickname = nickEl.value.trim() || "Gość";
        const text = textEl.value.trim();

        if (text.length < 2) {
            alert("Wpisz treść komentarza.");
            return;
        }

        try {
            const postRef = doc(db, "posts", postId);
            await updateDoc(postRef, {
                comments: arrayUnion({
                    nickname: nickname,
                    text: text,
                    createdAt: new Date().toLocaleString("pl-PL", { hour: '2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric' })
                })
            });
            textEl.value = "";
            openCommentSections.add(postId);
        } catch (error) {
            console.error("Błąd dodawania komentarza:", error);
            alert("Nie udało się dodać komentarza.");
        }
    };

    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));

    onSnapshot(q, (snapshot) => {
        cleanupExpiredPosts(snapshot);
        allPosts = [];
        const now = new Date();

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const expireDate = getSafeDate(data.expiresAt);
            const createDate = getSafeDate(data.createdAt);

            if (expireDate && now > expireDate) return;
            if (!expireDate && createDate && (now - createDate) / (1000 * 60 * 60 * 24) > 30) return;

            allPosts.push({ id: docSnap.id, ...data });
        });
        renderPosts();
    });

    window.renderPosts = function () {
        const postsList = document.getElementById("postsList");
        const searchQuery = (document.getElementById("searchInput")?.value || "").toLowerCase();
        postsList.innerHTML = "";

        const filtered = allPosts.filter(post => {
            const textUpper = (post.text || "").toUpperCase();
            const textLower = (post.text || "").toLowerCase();
            const nickLower = (post.nickname || "").toLowerCase();

            if (currentTypeFilter === "OFERUJĘ" && !textUpper.includes("OFERUJ")) return false;
            if (currentTypeFilter === "SZUKAM" && !textUpper.includes("SZUKAM")) return false;
            if (searchQuery && !textLower.includes(searchQuery) && !nickLower.includes(searchQuery)) return false;

            return true;
        });

        if (filtered.length === 0) {
            postsList.innerHTML = `<div style="text-align:center; padding: 40px 20px; color: var(--text-muted); border: 1px dashed var(--border-color); border-radius: 20px;">Brak pasujących ogłoszeń.</div>`;
            return;
        }

        filtered.forEach(post => {
            const postId = post.id;
            const div = document.createElement("div");
            div.className = "post-card";

            const postDate = getSafeDate(post.createdAt);
            const dateStr = postDate ? postDate.toLocaleString("pl-PL", { hour: '2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric' }) : "przed chwilą";

            const safeNickname = escapeHtml(post.nickname || "Anonim");
            let displayText = post.text || "";
            let badgeTypeHtml = "";

            const tagMatch = displayText.match(/^\[(SZUKAM|OFERUJĘ)\]\s*/i);
            if (tagMatch) {
                const mode = tagMatch[1].toUpperCase();
                displayText = displayText.replace(tagMatch[0], "");

                badgeTypeHtml = mode === "OFERUJĘ"
                    ? `<span class="badge-type badge-offer">🟢 Oferuję</span>`
                    : `<span class="badge-type badge-seek">🔍 Szukam</span>`;
            }

            const rawContact = (post.contact || "").trim();
            const contactHtml = formatContact(rawContact);

            const comments = Array.isArray(post.comments) ? post.comments : [];
            const isCommentsOpen = openCommentSections.has(postId) ? "open" : "";

            const commentsHtml = comments.length > 0
                ? comments.map(c => `
                    <div class="comment-item">
                        <div class="comment-meta">
                            <strong><i class="fas fa-user-circle"></i> ${escapeHtml(c.nickname || "Anonim")}</strong>
                            <span>${escapeHtml(c.createdAt || "")}</span>
                        </div>
                        <div>${escapeHtml(c.text || "")}</div>
                    </div>
                `).join("")
                : `<div style="font-size:13px; color: var(--text-muted); margin-bottom:10px;">Brak odpowiedzi. Bądź pierwszy!</div>`;

            div.innerHTML = `
                <div class="post-header">
                    <div class="post-badges">
                        <span class="post-author"><i class="fas fa-user-circle"></i> ${safeNickname}</span>
                        ${badgeTypeHtml}
                    </div>
                    <div class="post-date">${dateStr}</div>
                </div>

                <div class="post-text">${escapeHtml(displayText)}</div>

                <div class="post-footer">
                    <div class="post-contact">
                        <i class="fas fa-at"></i> ${contactHtml}
                    </div>
                    <button type="button" class="toggle-comments-btn" onclick="toggleComments('${postId}')">
                        <i class="far fa-comment-dots"></i> Komentarze (${comments.length})
                    </button>
                </div>

                <div class="comments-container ${isCommentsOpen}" id="comments-${postId}">
                    <div class="comments-list">${commentsHtml}</div>
                    <div class="comment-form">
                        <input type="text" id="comment-nick-${postId}" placeholder="Twój nick" maxlength="35">
                        <input type="text" id="comment-text-${postId}" placeholder="Napisz odpowiedź..." maxlength="300">
                        <button type="button" class="comment-btn" onclick="addComment('${postId}')">Wyślij</button>
                    </div>
                </div>
            `;

            postsList.appendChild(div);
        });
    };

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.innerText = text;
        return div.innerHTML;
    }

    function formatContact(contact) {
        if (!contact) return "Brak";
        const trimmed = contact.trim();
        const safeText = escapeHtml(trimmed);

        if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
            return `<a href="${safeText}" target="_blank" rel="noopener noreferrer">Link zewnętrzny</a>`;
        }

        if (trimmed.includes("@") && !trimmed.includes(" ")) {
            return `<a href="mailto:${safeText}">${safeText}</a>`;
        }

        return safeText;
    }
</script>
</body>
</html>
